name: Verify NutriCare Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, unit and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: |
          dotnet restore tests/NutriCare.Tests/NutriCare.Tests.csproj
          dotnet build tests/NutriCare.Tests/NutriCare.Tests.csproj --configuration Release --no-restore
      - name: Install PDF browser
        shell: pwsh
        run: |
          & tests/NutriCare.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          $browser = Get-ChildItem -LiteralPath (Join-Path $env:HOME '.cache/ms-playwright') -Recurse -File -Filter chrome | Select-Object -First 1
          if (-not $browser) { throw 'Installed PDF browser was not found' }
          "NUTRICARE_PDF_BROWSER=$($browser.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        run: dotnet test tests/NutriCare.Tests/NutriCare.Tests.csproj --configuration Release --no-build --filter 'Category!=SqlIntegration' --logger 'trx;LogFileName=backend.trx' --results-directory artifacts/backend-tests
      - name: Verify migration model
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.12
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations has-pending-model-changes --project src/backend/NutriCare.Persistence --startup-project src/backend/NutriCare.API --context NutriCareDbContext --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: artifacts/backend-tests
          if-no-files-found: ignore

  sql-integration:
    name: Isolated SQL Server integration tests
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: CiOnly!${{ github.run_id }}StrongPass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      NUTRICARE_TEST_SQL_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=CiOnly!${{ github.run_id }}StrongPass123;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/NutriCare.Tests/NutriCare.Tests.csproj
      - name: Run SQL tests against disposable test databases
        run: dotnet test tests/NutriCare.Tests/NutriCare.Tests.csproj --configuration Release --no-restore --filter 'Category=SqlIntegration' --logger 'trx;LogFileName=sql.trx' --results-directory artifacts/sql-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-results
          path: artifacts/sql-tests
          if-no-files-found: ignore

  portal:
    name: Portal types, lint, build and browser checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nutricare-pro-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nutricare-pro-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser contract and responsive journeys
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-results
          path: |
            frontend/nutricare-pro-portal/playwright-report
            frontend/nutricare-pro-portal/test-results
          if-no-files-found: ignore

# Production promotion uses the reviewed runbook and an approval-protected deployment environment.

