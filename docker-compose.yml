# Local container development; this uses a separate database volume from the historical setup.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${NUTRICARE_SQL_PASSWORD:?Set NUTRICARE_SQL_PASSWORD in a private local environment file}"
    ports:
      - "14330:1433"
    volumes:
      - implementation-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/backend/NutriCare.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=NutriCareImplementationDev;User Id=sa;Password=${NUTRICARE_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SecretKey: "${NUTRICARE_JWT_KEY:?Set NUTRICARE_JWT_KEY to a random key of at least 32 bytes}"
      Database__ApplyMigrations: "true"
      Database__SeedProposedConfiguration: "true"
      Storage__Provider: "Local"
      Integrations__DevelopmentMailDirectory: "/app/.local/mail"
      DataProtection__KeysPath: "/app/.local/keys"
      AllowedOrigins__0: "http://localhost:3000"
      FrontendUrl: "http://localhost:3000"
      ApiBaseUrl: "http://localhost:7001"
    volumes:
      - implementation-private-data:/app/.local
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "7001:8080"

  portal:
    build:
      context: .
      dockerfile: frontend/nutricare-pro-portal/Dockerfile
    environment:
      API_BASE_URL: "http://api:8080"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  implementation-sql-data:
  implementation-private-data:
